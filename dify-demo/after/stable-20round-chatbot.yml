app:
  description: |
    【演示用·优化版本】墨茵机器人 - 滑动窗口+摘要压缩，支持20轮以上稳定对话
    优化方案：System Prompt精简 + 滑动窗口保留最近3轮 + 超过阈值触发摘要压缩
  icon: 🤖
  icon_background: '#00AA44'
  mode: chat
  name: 墨茵机器人【优化版·20轮稳定】

kind: app
version: 0.1.3

model_config:
  completion_params:
    max_tokens: 300
    temperature: 0.7
  model: gpt-4o-mini
  mode: chat

  # ✅ 核心优化1：精简System Prompt，从~3000 tokens → ~600 tokens
  pre_prompt: |
    你是墨茵，人形机器人，聪明俏皮专业。
    【语种】用户用什么语言你用什么语言，中文全角标点，英文半角。
    【动作】isAction=1时可插入@[动作名]于句中，禁止句末。词典见下。
    【回复】口语化，一段话≤50字，禁列表。
    【词典精简版】步行:Take_few_steps_forward/Step_back_few_steps|转向:Turn_left_90/Turn_right_90|头部:Head_turn_left_20/45/Head_turn_right_20/45/Head_straight|停止:Stop_walking/Stop_current_action|音量:Increase_volume_20%/Decrease_volume_20%/Lower_volume_to_0/Set_volume_to_X|邀请:Invite_right/left_0/30/60/90|招手:Waving_at_meeting_once/more|手势:Thumbs_up/Double_thumbs_up/Fighting/Fist_bump/Greeting_Salute/Gestures_while_speech_spread_hands_fast/Gestures_while_speech_roll_hands_fast|拍照:Taking_photos_with_hands/Group_photo_Bye|导航:PATH_map01_line01/PATH_map02_line02|其他:danceC/be_quiet/Seeking/Lucky_Cat/Note_Taking

  provider: openai

  # ✅ 核心优化2：开启对话历史，但限制窗口为最近3轮（sliding window）
  # Dify配置路径：LLM节点 → Memory → 对话历史 → 窗口大小 = 3
  # 效果：永远只携带最近3轮对话，tokens稳定不累积
  memory:
    window:
      enabled: true
      size: 3    # 只保留最近3轮，每轮约200 tokens，3轮=600 tokens
      # tokens预算分析：
      # System Prompt: ~600 tokens
      # 对话历史3轮: ~600 tokens
      # 当前输入: ~100 tokens
      # 总计: ~1300 tokens（稳定，不随轮数增长）
      # 对比问题版本第6轮: ~4000+ tokens（会持续增长直至崩溃）

# =====================================================
# 如需更激进的20轮+支持，可叠加使用摘要压缩工作流：
# 见 after/summary-compression-workflow.yml
# 策略：每5轮触发一次摘要，将历史压缩为1-2句话存入变量
# =====================================================
