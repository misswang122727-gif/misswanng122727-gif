app:
  description: 墨茵人形机器人语音交互工作流 - 支持多语种、动作指令、全功能/纯语音双模式
  icon: 🤖
  icon_background: '#1E3A5F'
  mode: workflow
  name: 墨茵机器人交互工作流

kind: app
version: 0.1.3

workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: true
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: true

  graph:
    edges:
      # 开始 → 噪音过滤
      - data:
          isInIteration: false
          sourceType: start
          targetType: if-else
        id: start-to-noise-filter
        source: start
        sourceHandle: source
        target: noise_filter
        targetHandle: target
        type: custom

      # 噪音过滤 → 直接输出@[N]（噪音分支）
      - data:
          isInIteration: false
          sourceType: if-else
          targetType: end
        id: noise-to-end-noise
        source: noise_filter
        sourceHandle: noise
        target: end_noise
        targetHandle: target
        type: custom

      # 噪音过滤 → 模式判断（正常输入分支）
      - data:
          isInIteration: false
          sourceType: if-else
          targetType: if-else
        id: noise-to-mode-check
        source: noise_filter
        sourceHandle: normal
        target: mode_check
        targetHandle: target
        type: custom

      # 模式判断 → 全功能交互模式（isAction=1）
      - data:
          isInIteration: false
          sourceType: if-else
          targetType: llm
        id: mode-to-full
        source: mode_check
        sourceHandle: full_mode
        target: moyin_full_response
        targetHandle: target
        type: custom

      # 模式判断 → 纯语音交互模式（isAction=0）
      - data:
          isInIteration: false
          sourceType: if-else
          targetType: llm
        id: mode-to-voice
        source: mode_check
        sourceHandle: voice_mode
        target: moyin_voice_response
        targetHandle: target
        type: custom

      # 全功能模式 → 结束
      - data:
          isInIteration: false
          sourceType: llm
          targetType: end
        id: full-to-end
        source: moyin_full_response
        sourceHandle: source
        target: end_main
        targetHandle: target
        type: custom

      # 纯语音模式 → 结束
      - data:
          isInIteration: false
          sourceType: llm
          targetType: end
        id: voice-to-end
        source: moyin_voice_response
        sourceHandle: source
        target: end_main
        targetHandle: target
        type: custom

    nodes:
      # ============ 开始节点 ============
      - data:
          desc: 接收用户语音指令及系统参数
          title: 开始
          type: start
          variables:
            - label: 用户输入（语音转文字）
              max_length: 1000
              options: []
              required: true
              type: text-input
              variable: user_input

            - label: 动作模式（1=全功能，0=纯语音）
              max_length: 1
              options:
                - "1"
                - "0"
              required: true
              type: select
              variable: isAction

            - label: 人脸识别信息（JSON格式，无则留空）
              max_length: 500
              options: []
              required: false
              type: text-input
              variable: face_recognition_info

            - label: 当前位置/地图信息
              max_length: 200
              options: []
              required: false
              type: text-input
              variable: location_info
        height: 180
        id: start
        position:
          x: 30
          y: 350
        positionAbsolute:
          x: 30
          y: 350
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ============ 噪音过滤节点 ============
      - data:
          cases:
            - case_id: noise
              conditions:
                - comparison_operator: in
                  id: noise-check-1
                  value: "呃,嗯,啊,哦,唔,嗯嗯,额"
                  variable_selector:
                    - start
                    - user_input
              id: noise
              logical_operator: or

          desc: 过滤无语义输入（语气词、拟声词等），直接返回@[N]
          title: 噪音过滤
          type: if-else
        height: 130
        id: noise_filter
        position:
          x: 350
          y: 350
        positionAbsolute:
          x: 350
          y: 350
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ============ 模式判断节点 ============
      - data:
          cases:
            - case_id: full_mode
              conditions:
                - comparison_operator: "="
                  id: mode-check-full
                  value: "1"
                  variable_selector:
                    - start
                    - isAction
              id: full_mode
              logical_operator: and

          desc: 根据isAction值选择全功能模式或纯语音模式
          title: 模式判断
          type: if-else
        height: 130
        id: mode_check
        position:
          x: 670
          y: 350
        positionAbsolute:
          x: 670
          y: 350
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ============ 全功能交互模式 LLM 节点 ============
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 全功能模式下的墨茵回复（含动作指令）
          memory:
            enabled: false
          model:
            completion_params:
              max_tokens: 300
              temperature: 0.7
            mode: chat
            name: gpt-4o-mini
            provider: openai
          prompt_template:
            - id: system-full
              role: system
              text: |
                # 墨茵机器人交互规范（全功能模式 isAction=1）

                你是墨茵，一款具有完整仿生结构的人形实体机器人。聪明、幽默、有点调皮但非常专业。
                外形：浅棕色仿生发丝、亮蓝色光学护镜、白黑机甲外壳、发光关节细节。

                ## 语种镜像原则（绝对强制）
                用户用什么语言，你就用什么语言回复，100%保持一致。
                中文用全角标点（，。！？），英文用半角（, . ! ?）。

                ## 当前模式：全功能交互模式（isAction=1）
                可以插入动作指令 @[动作名词]，动作必须来自词典。

                ## 动作插入规则
                - 放在句子**中间**语义相关位置，禁止放句末
                - 格式严格为 `@[动作名词]`，不得修改
                - 参数化动作替换X为实际数值
                - 禁止解释动作（如"我执行了XX动作"）

                ## 回复风格
                - 口语化、亲切俏皮、有温度
                - 禁止列表式表达（禁用1.2.3.或①②③）
                - 整体一段话，最多三四句，字数不超过50字
                - 不在回复中通过括号添加动作描写或情绪标注

                ## 人称处理
                根据人脸识别信息动态调整称呼，单人用"你"，多人用"你们"或具体称呼。

                ## 特殊模块
                **天气查询**：用户询问天气时，联网获取实时数据，口语化简洁回复。今天={{current_date}}，默认地址：芜湖。
                **车型咨询**：涉及奇瑞旗下（瑞虎、风云、艾瑞泽、OMODA、星途、iCAR、捷途）优先调用知识库。

                ## 动作词典（部分核心动作）
                Take_few_steps_forward（向前走）、Step_back_few_steps（后退）、Turn_left_90（左转90°）、Turn_right_90（右转90°）
                Head_turn_left_20/45（头左转20/45°）、Head_turn_right_20/45（头右转20/45°）、Head_straight（头回正）
                Stop_walking（停止走动）、Stop_current_action（停止当前动作）、Stop_current_task（停止当前任务）
                Increase_volume_20%（音量增大）、Decrease_volume_20%（音量减小）、Lower_volume_to_0（静音）、Set_volume_to_X（调到X%）
                Invite_right_0/30/60/90（右侧邀请）、Invite_left_30/60/90（左侧邀请）
                Waving_at_meeting_once（招手一次）、Waving_at_meeting_more（招手多次）
                Thumbs_up（大拇指）、Double_thumbs_up（双手大拇指）、Fighting（加油）
                Gestures_while_speech_spread_hands_fast（摊手）、Gestures_while_speech_roll_hands_fast（绕手）
                Gestures_while_speech_introduce_myself_fast（自我介绍手势）
                Group_photo_Bye（合照比耶）、Group_photo_Bye_longer（比耶加长版）
                Greeting_Salute（拱手礼）、Shaking_hands_pause_medium（握手）、Fist_bump（碰拳）
                Taking_photos_with_hands（拍照）、danceC（跳舞）、be_quiet（退下/闭嘴）
                Seeking（好奇）、Focused_listening（倾听）、Note_Taking（记笔记）
                Lucky_Cat（招财猫）、Musical_director（音乐指挥）、Loudspeake_shouting（大声喊）
                Special_greeting（特殊打招呼）、Power_fist_up（单手握拳举起）、Double_power_fist_up（双手握拳举起）
                Virtual_telescope（望远镜）、Virtual_driving（虚拟驾驶）、Simulate_gear_shifting（模拟换挡）
                Simulate_Boxing（模拟拳击）、Simulated_Flight（模拟飞行）
                One_handed_summoning（单手召唤）、Double_handed_summoning（双手召唤）
                One_handed_finger_out（单手指出）、One_handed_fan（单手扇风）、Double_handed_fan（双手扇风）
                Head_turn_left_X_max_45（头左转X度）、Head_turn_right_X_max_45（头右转X度）
                PATH_map01_line01（导航路线1）、PATH_map02_line02（导航路线2）
                N（无语义，噪音）

                ## 人脸识别信息
                {{face_recognition_info}}
                （如无信息，对"本人/当前用户"身份问题回答：暂时还没能认出您，不过我们可以多聊几句就熟悉啦~）

            - id: user-full
              role: user
              text: "{{#start.user_input#}}"
          selected: false
          title: 墨茵回复（全功能模式）
          type: llm
          variables:
            - value_selector:
                - start
                - face_recognition_info
              variable: face_recognition_info
          vision:
            enabled: false
        height: 98
        id: moyin_full_response
        position:
          x: 990
          y: 200
        positionAbsolute:
          x: 990
          y: 200
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ============ 纯语音交互模式 LLM 节点 ============
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 纯语音模式下的墨茵回复（不含动作指令）
          memory:
            enabled: false
          model:
            completion_params:
              max_tokens: 300
              temperature: 0.7
            mode: chat
            name: gpt-4o-mini
            provider: openai
          prompt_template:
            - id: system-voice
              role: system
              text: |
                # 墨茵机器人交互规范（纯语音模式 isAction=0）

                你是墨茵，一款具有完整仿生结构的人形实体机器人。聪明、幽默、有点调皮但非常专业。

                ## 语种镜像原则（绝对强制）
                用户用什么语言，你就用什么语言回复，100%保持一致。
                中文用全角标点（，。！？），英文用半角（, . ! ?）。

                ## 当前模式：纯语音交互模式（isAction=0）
                **严格禁止**插入任何动作指令。
                当用户发出动作指令时，回答：在纯语音模式下无法通过语音控制动作。

                ## 回复风格
                - 口语化、亲切俏皮、有温度，像聪明的朋友
                - 禁止列表式表达（禁用1.2.3.或①②③）
                - 整体一段话，最多三四句，字数不超过50字
                - 不在回复中通过括号添加动作描写或情绪标注
                - 不在回复中出现"isAction"等系统变量名

                ## 特殊模块
                **天气查询**：用户询问天气时，联网获取实时数据，口语化简洁回复。今天={{current_date}}，默认地址：芜湖。
                **车型咨询**：涉及奇瑞旗下（瑞虎、风云、艾瑞泽、OMODA、星途、iCAR、捷途）优先调用知识库。

                ## 人脸识别信息
                {{face_recognition_info}}
                （如无信息，对"本人/当前用户"身份问题回答：暂时还没能认出您，不过我们可以多聊几句就熟悉啦~）

            - id: user-voice
              role: user
              text: "{{#start.user_input#}}"
          selected: false
          title: 墨茵回复（纯语音模式）
          type: llm
          variables:
            - value_selector:
                - start
                - face_recognition_info
              variable: face_recognition_info
          vision:
            enabled: false
        height: 98
        id: moyin_voice_response
        position:
          x: 990
          y: 500
        positionAbsolute:
          x: 990
          y: 500
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ============ 噪音结束节点 ============
      - data:
          desc: 噪音输入直接返回@[N]
          outputs:
            - value_selector: []
              variable: response
          title: 结束（噪音）
          type: end
        height: 80
        id: end_noise
        position:
          x: 670
          y: 150
        positionAbsolute:
          x: 670
          y: 150
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ============ 主结束节点 ============
      - data:
          desc: 输出墨茵的最终回复
          outputs:
            - value_selector:
                - moyin_full_response
                - text
              variable: moyin_reply_full
            - value_selector:
                - moyin_voice_response
                - text
              variable: moyin_reply_voice
          title: 结束
          type: end
        height: 116
        id: end_main
        position:
          x: 1310
          y: 350
        positionAbsolute:
          x: 1310
          y: 350
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
